name: Daily Question Runner

on:
  schedule:
    # GitHub Actions cron uses UTC. Adjust these values if you need a different timezone.
    - cron: '0 6 * * *'
    - cron: '0 11 * * *'
    - cron: '0 16 * * *'
  workflow_dispatch:

jobs:
  ask-question:
    runs-on: ubuntu-latest
    steps:
      - name: Run question
        run: |
          echo "1+1=?"
          echo "1+1=2"
